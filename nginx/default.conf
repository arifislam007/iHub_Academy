# Per-client limit for the public admission form (backend also rate-limits)
limit_req_zone $binary_remote_addr zone=contact_form:10m rate=10r/m;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 16k;

  # TLS terminates at the outer nginx proxy. Take the real client IP from its
  # X-Forwarded-For header, but only when the request comes from a private network
  # (Docker bridge / host), so outside callers cannot spoof it.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Security headers (HSTS belongs on the outer TLS proxy).
  # Note: any location with its own add_header must include this file again.
  include /etc/nginx/snippets/security-headers.conf;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /api/contacts {
    limit_req zone=contact_form burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/api-proxy.conf;
  }

  # Proxy API requests to backend service in compose network
  location /api/ {
    include /etc/nginx/snippets/api-proxy.conf;
  }

  location ~* \.(?:css|js|mjs|json|ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
}
